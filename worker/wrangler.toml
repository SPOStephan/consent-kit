# Cloudflare-Konfiguration des consent-kit Protokollierungs-Workers.
# Anleitung: docs/WORKER.md
name = "consent-log"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Alte Einträge einmal täglich löschen (siehe RETENTION_DAYS)
[triggers]
crons = ["17 3 * * *"]

[vars]
# Ihre Domains – GENAU so, wie sie im Browser stehen (mit https://, ohne / am Ende)
ALLOWED_ORIGINS = "https://meine-seite.de,https://www.meine-seite.de"
# Aufbewahrungsdauer in Tagen (3 Jahre)
RETENTION_DAYS = "1095"

[[d1_databases]]
binding = "DB"
database_name = "consent-log"
# Hier die ID eintragen, die `npx wrangler d1 create consent-log` ausgibt:
database_id = "HIER-DATABASE-ID-EINTRAGEN"

# Rate-Limiting: max. 20 Protokoll-Einträge pro Minute und IP-Adresse
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# ADMIN_TOKEN ist ein Geheimnis und steht NICHT hier, sondern wird gesetzt mit:
#   npx wrangler secret put ADMIN_TOKEN
